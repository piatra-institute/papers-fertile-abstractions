  passage: Xu and colleagues defined usable information relative to a computationally bounded observer; unlike Shannon
    information, it can be created by computation [@xu2020].
  evidence:
    citation_id: xu2020
    locator: Abstract
    verification_note: 'arXiv abstract read: V-information can be created through computation, violating the data
      processing inequality.'
    verified: true
- id: s-carnap
  kind: source
  passage: Carnap required that an explication be fruitful, useful for formulating many universal statements [@carnap1950];
    Kuhn listed fruitfulness with accuracy, consistency, scope and simplicity as shared criteria of theory choice
    [@kuhn1977]; Lakatos judged research programmes by whether they keep predicting novel facts [@lakatos1970];
    and McMullin examined fertility, a theory's capacity to be developed fruitfully, and argued that it makes the
    theory as developed over time the proper unit of appraisal [@mcmullin1976].
  evidence:
    citation_id: carnap1950
    locator: Chapter I, section 3
    verification_note: Identity checked (Open Library); requirements for an explicatum in Chapter I, section 3,
      include fruitfulness for formulating universal statements.
    verified: true
