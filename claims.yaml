- id: i-lim
  kind: assumption
  passage: The learner is deliberately simple.
  rationale: No observational-equivalence pruning, no learned search policy, greedy compressor with two picks per
    round.
- id: i-main
  kind: interpretation
  passage: What the results do not support is that fertility can be read from the record an abstraction has when
    it is adopted.
  rationale: Section 5.4 predictor agreements against reliability ceilings; Section 5.5 budget dependence.
- id: i-refute
  kind: interpretation
  passage: Several results would change this picture.
  rationale: States the conditions under which the conclusions would be narrowed.
- id: i-share
  kind: interpretation
  passage: 'The look-ahead''s partial success in the list domain and its failure in navigation also leave open what
    makes fertility estimable: in the list domain test families share concepts with the curriculum, while in navigation
    each pair of rooms poses its own route, and estimation from the curriculum depends on such sharing.'
  rationale: Offered explanation for the difference between domains; not tested directly.
- id: i-end
  kind: normative
  passage: A learner that cares about what it will discover next has to spend computation looking ahead at its own
    curriculum, and the value it estimates holds only for the budget at which it looked.
  rationale: Practical recommendation drawn from the predictor and budget results; holds for the learners simulated.
