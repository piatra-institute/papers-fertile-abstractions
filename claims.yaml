- id: s1-claim
  kind: interpretation
  passage: In both, discovery value varies more across abstractions than direct value does, takes both signs, and
    is reliable across independent test problems; the compression of past solutions predicts it barely or not at
    all, direct value predicts it with the wrong sign, and the best predictor we tested, a costly look-ahead on
    the learner's own curriculum, recovers about a third of the attainable benefit in one domain and little in the
    other.
  rationale: Choice gain of the look-ahead 0.036 against 0.114 for the best candidate in hindsight (list domain),
    0.006 against 0.066 in navigation.
- id: s1-scope
  kind: assumption
  passage: The setting is program search with a growing library.
  rationale: 'Scope restriction: no claim about imagery, experience, people or deployed systems.'
