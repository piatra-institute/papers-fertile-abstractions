- id: d-comp
  kind: assumption
  passage: 'Compression is greedy description-length reduction in the manner of Stitch [@bowers2023] and of minimum
    description length more generally [@rissanen1978]: a contiguous pattern of $k$ tokens occurring $c$ times without
    overlap in the solutions saves $$g = c\,(k - 1) - k$$ tokens, the shortened occurrences minus the definition;
    the compressor adds the pattern with the largest saving among patterns of two or three tokens that occur at
    least twice, rewrites the solutions, and repeats once, skipping patterns whose behaviour is the identity or
    duplicates a token.'
  rationale: The compressor (engine.compress) is a simplified MDL compressor; a different compressor would change
    which abstractions are learned.
- id: d-values
  kind: definition
  passage: The direct value, discovery value and total value of $a$ are $$V_{\mathrm{direct}}(a) = U(L \cup \{a\}
    \cup K_0) - U(L \cup K_0), \qquad V_{\mathrm{disc}}(a) = U(L \cup \{a\} \cup K_1) - U(L \cup \{a\} \cup K_0),$$
    and $V_{\mathrm{total}}(a) = V_{\mathrm{direct}}(a) + V_{\mathrm{disc}}(a)$.
  rationale: Defines the three values; check decomposition_identity verifies V_total = V_direct + V_disc for every
    candidate.
- id: d-relative
  kind: interpretation
  passage: Discovery value is relative to the learner, the discovery and evaluation budgets, the curriculum and
    the distribution of later tasks; it is not a property of the abstraction alone.
  rationale: Follows from the definition; Propositions 2 and 3 exhibit dependence on later demands and budget.
- id: d-mediation
  kind: interpretation
  passage: Because evaluation depends only on the learned set, $V_{\mathrm{disc}}(a) \neq 0$ requires $K_1 \neq
    K_0$.
  rationale: Canonical evaluation order; check identical_library_zero_value confirms zero discovery value whenever
    the learned sets coincide.
- id: p2
  kind: interpretation
  passage: 'The difference between $a$ and $a''$ lies entirely in the later tasks: those tasks reuse two copies
    of $a$ and never two copies of $a''$.'
  rationale: Proposition 2, proved in Section 4.1 and verified by exact enumeration (checks separation_matched and
    separation_differs).
- id: p3
  kind: interpretation
  passage: The fertility of $a$ depends on discovery programs of four tokens and that of $b$ on programs of three,
    and the deeper one is lost first.
  rationale: Proposition 3, proved in Section 4.2 and verified by exact enumeration (checks reversal_high_order
    and reversal_low_order).
- id: p3c
  kind: interpretation
  passage: The corollary does not say that such scores carry no information about discovery value; it says that
    any relation between them and discovery value must change with the budget, and Section 5.5 measures how much
    it changes.
  rationale: Corollary of Proposition 3; check compression_budget_independent confirms compression ranks are identical
    across costs.
- id: d-pred
  kind: definition
  passage: 'These two observations suggest a ladder of predictors, ordered by what they use and how much they cost:'
  rationale: Defines the seven predictors computed in experiment.run_world.
- id: a-exch
  kind: assumption
  passage: A learner can still estimate it if the families in its curriculum resemble later families, for example
    if both are drawn from the same process.
  rationale: Exchangeability of task families; in both simulated domains discovery and test families are drawn from
    the same process.
- id: a-lists
  kind: assumption
  passage: Each world draws five level-1 concepts, sequences of two to four primitives with no shorter primitive
    description and distinct behaviours, and four level-2 concepts, sequences of two or three units of which each
    is a level-1 concept with probability 0.75 and a primitive otherwise, with at least two concepts.
  rationale: World generator parameters for the list domain (lists.make_world, analyses.LISTS).
- id: a-maze
