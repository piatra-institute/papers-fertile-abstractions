web_blurb: A learned abstraction can change what a bounded learner discovers next. Separating that discovery
  value from an abstraction's direct use shows that it is large, two-signed and reliable in simulated
  program-search worlds, that compression of past solutions barely predicts it, and that rankings by it
  reverse as verification becomes more expensive.
